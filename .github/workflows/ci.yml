name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Test (embedded PostgreSQL - no Docker needed)
        run: mvn -B -f backend/pom.xml verify

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Web bundles build
        run: |
          for a in customer partner agent; do (cd apps/$a && npx expo export --platform web --output-dir dist); done
