# Reference production deployment for the backend (any managed Kubernetes: EKS / GKE / AKS / DOKS).
# Multiple replicas spread across >= 2 availability zones, health-gated rollouts, disruption budget and autoscaling.
# Secrets come from a Secret synced from the cloud secret manager (e.g. External Secrets Operator) - never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buzzer-backend
  labels: { app: buzzer-backend }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: buzzer-backend }
  template:
    metadata:
      labels: { app: buzzer-backend }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: buzzer-backend } }
      terminationGracePeriodSeconds: 40
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: backend
          image: REGISTRY/buzzer-backend:VERSION
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: buzzer-backend-secrets } }]
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits: { memory: "1536Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 3
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: buzzer-backend }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: buzzer-backend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: buzzer-backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: buzzer-backend }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: v1
kind: Service
metadata: { name: buzzer-backend }
spec:
  selector: { app: buzzer-backend }
  ports: [{ port: 80, targetPort: 8080 }]
