# BUZZER backend configuration.
# All secrets come from environment variables. See ../.env.example and docs/deployment.md.
spring:
  application:
    name: buzzer-backend
  datasource:
    url: ${BUZZER_DB_URL:jdbc:postgresql://localhost:5432/buzzer}
    username: ${BUZZER_DB_USER:buzzer}
    password: ${BUZZER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${BUZZER_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1200000
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

buzzer:
  security:
    jwt-secret: ${BUZZER_JWT_SECRET}
    access-token-minutes: ${BUZZER_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${BUZZER_REFRESH_TOKEN_DAYS:30}
    issuer: buzzer
  otp:
    pepper: ${BUZZER_OTP_PEPPER}
    ttl-seconds: 300
    max-attempts: 5
    max-requests-per-hour: 5
    expose-code-in-response: false
  payments:
    provider: ${BUZZER_PAYMENT_PROVIDER:mock}
    webhook-secret: ${BUZZER_PAYMENT_WEBHOOK_SECRET}
    test-mode: true
  cors:
    allowed-origins: ${BUZZER_CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:8083}
  notifications:
    sms:
      provider: ${BUZZER_SMS_PROVIDER:log}
  support:
    phone: ${BUZZER_SUPPORT_PHONE:+914000000000}
  outbox:
    poll-ms: 2000
  escalation:
    poll-ms: 60000
  health:
    customer-app-url: ${BUZZER_HEALTH_CUSTOMER_URL:}
    partner-app-url: ${BUZZER_HEALTH_PARTNER_URL:}
    agent-app-url: ${BUZZER_HEALTH_AGENT_URL:}
    admin-panel-url: ${BUZZER_HEALTH_ADMIN_URL:}
